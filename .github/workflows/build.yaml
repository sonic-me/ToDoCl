name: Build TaskTicket

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B build -S . -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Upload TaskTicket.exe
        uses: actions/upload-artifact@v4
        with:
          name: TaskTicket
          path: build/Release/TaskTicket.exe
